<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard | ConceptQuizzer</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #4f46e5, #7c3aed, #9333ea);
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

.header p {
    font-size: 16px;
    opacity: 0.85;
}

/* PROFILE */

.profile {
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    padding: 22px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 18px;
}

.avatar {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(135deg,#facc15,#f97316);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    flex-shrink: 0;
}

.profile h2 {
    font-size: 22px;
}

.profile p {
    opacity: 0.8;
    margin-top: 5px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    color: #222;
    border-radius: 22px;
    padding: 22px;
    min-height: 150px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.statIcon {
    font-size: 32px;
    margin-bottom: 12px;
}

.statValue {
    font-size: 30px;
    font-weight: bold;
    color: #4f46e5;
}

.statTitle {
    margin-top: 5px;
    color: #666;
    font-size: 14px;
}

/* PROGRESS */

.progressCard {
    background: white;
    color: #222;
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.progressHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.progressHeader h2 {
    font-size: 21px;
}

.progressPercent {
    font-size: 22px;
    font-weight: bold;
    color: #4f46e5;
}

.progressBar {
    width: 100%;
    height: 18px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#4f46e5,#9333ea);
    border-radius: 20px;
    transition: width 0.8s ease;
}

.progressText {
    margin-top: 12px;
    color: #666;
    font-size: 14px;
}

/* QUICK ACTIONS */

.actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.actionBtn {
    border: none;
    border-radius: 18px;
    padding: 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.2s;
}

.actionBtn:active {
    transform: scale(0.97);
}

/* FOOTER */

.footer {
    text-align: center;
    opacity: 0.7;
    font-size: 13px;
    padding: 15px;
}

/* MOBILE */

@media(max-width:600px) {

    body {
        padding: 14px;
    }

    .header h1 {
        font-size: 28px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .stat {
        padding: 17px;
        min-height: 135px;
    }

    .statValue {
        font-size: 25px;
    }

    .actions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 Student Dashboard</h1>
        <p>Track your ConceptQuizzer learning journey</p>
    </div>

    <!-- PROFILE -->

    <div class="profile">

        <div class="avatar">
            🎓
        </div>

        <div>
            <h2 id="studentName">Student</h2>
            <p>Keep learning. Keep improving. 🚀</p>
        </div>

    </div>

    <!-- STAT CARDS -->

    <div class="stats">

        <div class="stat">

            <div class="statIcon">
                📚
            </div>

            <div
                class="statValue"
                id="chaptersCompleted">
                0
            </div>

            <div class="statTitle">
                Chapters Completed
            </div>

        </div>


        <div class="stat">

            <div class="statIcon">
                🎯
            </div>

            <div
                class="statValue"
                id="quizScore">
                0
            </div>

            <div class="statTitle">
                Total Quiz Score
            </div>

        </div>


        <div class="stat">

            <div class="statIcon">
                🔥
            </div>

            <div
                class="statValue"
                id="studyStreak">
                0
            </div>

            <div class="statTitle">
                Day Study Streak
            </div>

        </div>


        <div class="stat">

            <div class="statIcon">
                🏆
            </div>

            <div
                class="statValue"
                id="totalXP">
                0
            </div>

            <div class="statTitle">
                XP Earned
            </div>

        </div>

    </div>


    <!-- OVERALL PROGRESS -->

    <div class="progressCard">

        <div class="progressHeader">

            <h2>📈 Overall Progress</h2>

            <div
                class="progressPercent"
                id="progressPercent">
                0%
            </div>

        </div>

        <div class="progressBar">

            <div
                class="progressFill"
                id="progressFill">
            </div>

        </div>

        <div
            class="progressText"
            id="progressText">
            0 chapters completed
        </div>

    </div>


    <!-- QUICK ACTIONS -->

    <div class="actions">

        <button
            class="actionBtn"
            onclick="goHome()">
            🏠 Home
        </button>

        <button
            class="actionBtn"
            onclick="openQuiz()">
            🎯 Take a Quiz
        </button>

    </div>


    <div class="footer">
        ConceptQuizzer • Student Dashboard
    </div>

</div>


<script>

/* =========================================
   CONFIGURATION
========================================= */

/*
   Change this number when your full chapter
   database is finalized.
*/
const TOTAL_CHAPTERS = 50;


/* =========================================
   SAFE NUMBER
========================================= */

function getNumber(keys) {

    for (const key of keys) {

        const value = localStorage.getItem(key);

        if (value !== null && value !== "") {

            const number = Number(value);

            if (!Number.isNaN(number)) {
                return number;
            }
        }
    }

    return 0;
}


/* =========================================
   CHAPTERS COMPLETED
========================================= */

function getCompletedChapters() {

    const directValue = getNumber([
        "cq-chapters-completed",
        "chaptersCompleted",
        "completedChapters",
        "totalChaptersCompleted"
    ]);

    if (directValue > 0) {
        return directValue;
    }


    /*
       Also detect chapter completion keys
       if they are stored individually.
    */

    let count = 0;

    for (let i = 0; i < localStorage.length; i++) {

        const key = localStorage.key(i);

        if (!key) continue;

        const lower = key.toLowerCase();

        if (
            lower.includes("chapter-completed") ||
            lower.includes("chapter_completed") ||
            lower.includes("chaptercomplete") ||
            lower.includes("completed-chapter")
        ) {

            const value = localStorage.getItem(key);

            if (
                value === "true" ||
                value === "1" ||
                value === "completed"
            ) {
                count++;
            }
        }
    }

    return count;
}


/* =========================================
   QUIZ SCORE
========================================= */

function getQuizScore() {

    return getNumber([
        "cq-total-quiz-score",
        "totalQuizScore",
        "quizScore",
        "totalScore"
    ]);
}


/* =========================================
   XP
========================================= */

function getXP() {

    return getNumber([
        "cq-total-xp",
        "totalXP",
        "xp",
        "cq-xp"
    ]);
}


/* =========================================
   STUDY STREAK
========================================= */

function getStudyStreak() {

    return getNumber([
        "cq-study-streak",
        "studyStreak",
        "streak",
        "currentStreak"
    ]);
}


/* =========================================
   STUDENT NAME
========================================= */

function getStudentName() {

    const names = [
        "cq-student-name",
        "studentName",
        "userName",
        "username",
        "name"
    ];

    for (const key of names) {

        const value = localStorage.getItem(key);

        if (value && value.trim()) {
            return value.trim();
        }
    }

    return "Student";
}


/* =========================================
   UPDATE DASHBOARD
========================================= */

function updateDashboard() {

    const chapters = getCompletedChapters();

    const score = getQuizScore();

    const streak = getStudyStreak();

    const xp = getXP();


    document.getElementById(
        "studentName"
    ).textContent = getStudentName();


    document.getElementById(
        "chaptersCompleted"
    ).textContent = chapters;


    document.getElementById(
        "quizScore"
    ).textContent = score;


    document.getElementById(
        "studyStreak"
    ).textContent = streak;


    document.getElementById(
        "totalXP"
    ).textContent = xp;


    /* Overall progress */

    let percentage = 0;

    if (TOTAL_CHAPTERS > 0) {

        percentage =
            Math.round(
                (chapters / TOTAL_CHAPTERS) * 100
            );
    }

    percentage = Math.max(
        0,
        Math.min(100, percentage)
    );


    document.getElementById(
        "progressPercent"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        chapters +
        " of " +
        TOTAL_CHAPTERS +
        " chapters completed";
}


/* =========================================
   NAVIGATION
========================================= */

function goHome() {

    window.location.href = "index.html";
}


function openQuiz() {

    window.location.href = "quiz.html";
}


/* =========================================
   INITIALIZE
========================================= */

updateDashboard();


/*
   Automatically refresh dashboard when
   returning to the page.
*/

window.addEventListener(
    "pageshow",
    updateDashboard
);

window.addEventListener(
    "storage",
    updateDashboard
);

</script>

</body>
  </html>
