function chapterKeywords(name){

 `Study relationships between ideas. Ask: What causes what? What changes when a condition changes? Which rule, process, institution, quantity or principle explains the result?`,
 `Use representations wherever suitable: labelled diagrams, tables, timelines, maps, equations, flowcharts, examples or comparison boxes. A good representation should make the concept easier to explain.`,
 `Practise application. ${prof.real} For every major concept, create at least one familiar example and one unfamiliar problem.`,
 `Finish with active recall: close the notes and explain the chapter aloud, write five key points from memory, then solve questions without looking at the answer.`
 ];

  [`Which statement best describes the focus of “${chapter}”?`,`Understanding its central concepts and their meaning`,`Memorising unrelated facts`,`Ignoring examples`,`Studying a different chapter`],
  [`What is the best first step while studying “${chapter}”?`,`Identify the central idea and key vocabulary`,`Skip definitions`,`Only memorise answers`,`Avoid examples`],
  [`Which is a useful way to revise this chapter?`,`Explain key ideas in your own words`,`Read without thinking`,`Avoid questions`,`Memorise page numbers`]
 ],
 medium:[
  [`A student understands a definition but cannot use it in a new situation. What should the student practise next?`,`Application with examples and problems`,`Only copying the definition`,`Skipping the topic`,`Learning page numbers`],
  [`Which method best checks real understanding of “${chapter}”?`,`Explain why an answer is correct and apply it`,`Repeat one sentence`,`Guess without reasoning`,`Avoid unfamiliar questions`],
  [`Which study product would best organise connected ideas?`,`A concept map or flowchart`,`An unrelated drawing`,`A blank page`,`A list of page numbers`]
 ],
 hard:[
  [`Two answers reach the same conclusion, but only one gives chapter-based reasoning. Which is stronger?`,`The answer that justifies the conclusion using concepts`,`The shorter answer regardless of logic`,`The answer with more decoration`,`Both are always equal`],
  [`When a familiar example changes slightly, what should you do?`,`Reapply the underlying principle to the new conditions`,`Use the old answer without checking`,`Ignore the changed condition`,`Guess randomly`],
  [`Which response shows higher-order thinking?`,`Connecting cause, evidence and consequence`,`Repeating a heading`,`Copying a definition only`,`Listing page numbers`]
 ],
 "too-hard":[
  [`${names[0]} faces a real-life situation related to this chapter. What is the best approach?`,`Identify relevant concepts, analyse conditions, then justify a solution`,`Choose an answer before reading`,`Use an unrelated rule`,`Ignore evidence`],
  [`A case study contains both useful and distracting information. What should a learner do?`,`Select evidence relevant to the chapter concept`,`Use every detail equally`,`Ignore the question`,`Choose the longest option`],
  [`A claim about “${chapter}” conflicts with the chapter's core principle. What is the best response?`,`Test the claim against definitions, evidence and relationships`,`Accept it because it sounds confident`,`Ignore the principle`,`Memorise the claim`]
 ],
 "extreme-hard":[
  [`A complex problem combines several ideas from “${chapter}”. What is the strongest strategy?`,`Break it into parts, connect concepts, evaluate evidence and justify the final answer`,`Use one memorised sentence for everything`,`Ignore conflicting evidence`,`Answer before analysing`],
  [`Two plausible solutions fit part of a case. How should you choose?`,`Compare assumptions and consequences using chapter concepts`,`Choose randomly`,`Choose the first one`,`Avoid justification`],
  [`Which answer deserves the highest marks in an analytical question?`,`A precise conclusion supported by linked concepts, evidence and application`,`A long answer with no reasoning`,`A copied definition only`,`An unsupported opinion`]
 ]};
 let pool=stems[l].map(x=>({q:x[0],o:x.slice(1),a:x[1]}));
 for(let i=0;i<22;i++){
   const k=c[i%c.length], n=i+4;
   let q,o,a;
   if(l==="easy"){q=`Question ${n}: While revising ${k} in “${chapter}”, which action is most useful?`;a=`Define ${k} and connect it with the chapter`;o=[a,`Ignore ${k}`,`Study an unrelated topic`,`Memorise without meaning`]}
   else if(l==="medium"){q=`Question ${n}: Which task best applies the idea of ${k}?`;a=`Use ${k} to explain a relevant example`;o=[a,`Copy the heading only`,`Avoid examples`,`Use an unrelated concept`]}
   else if(l==="hard"){q=`Question ${n}: A conclusion involving ${k} is given without reasoning. What is missing?`;a=`A justified link between ${k}, evidence and the conclusion`;o=[a,`More decoration`,`A longer title`,`An unrelated fact`]}
   else if(l==="too-hard"){q=`Question ${n}: In a real-life case, how should ${k} be used?`;a=`Identify relevant conditions and apply ${k} with justification`;o=[a,`Apply it without checking conditions`,`Ignore evidence`,`Choose by guess`]}
   else{q=`Question ${n}: A multi-step case involves ${k} plus another chapter idea. What should you do?`;a=`Analyse each idea, connect them, test assumptions and justify the result`;o=[a,`Use ${k} alone without analysis`,`Ignore contradictions`,`Pick the most familiar option`]}
   pool.push({q,o,a});
 }
 return pool.slice(0,25);
}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(l){
 lev=l;qs=seedQuestions(l).map(x=>({...x,o:shuffle(x.o)}));ans=new Array(25).fill(null);qi=0;left=levels[l].t*60;
 document.getElementById("levels").classList.remove("show");showQ();if(timer)clearInterval(timer);timer=setInterval(()=>{left--;clock();if(left<=0){clearInterval(timer);timer=null;submit(true)}},1000);
 setTimeout(()=>document.getElementById("quiz").scrollIntoView({behavior:"smooth"}),100)
}
function showQ(){let x=qs[qi],el=document.getElementById("quiz");el.classList.add("active");el.innerHTML=`<div class="top"><div><div class="eyebrow">${levels[lev].ic} ${levels[lev].n.toUpperCase()} • ${esc(chapter)}</div><h2>Quiz Challenge</h2></div><div class="timer">⏱️ <span id="clock"></span></div></div><div class="meta"><span>Question ${qi+1} of 25</span><strong>4 Marks</strong></div><div class="track"><div class="bar" style="width:${(qi+1)*4}%"></div></div><h3 class="q">${esc(x.q)}</h3><div class="opts">${x.o.map((o,i)=>`<button class="opt ${ans[qi]===o?"sel":""}" onclick='pick(${JSON.stringify(o)})'><b>${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></button>`).join("")}</div><div class="nav"><button class="prev" onclick="prev()" ${qi===0?"disabled":""}>← Previous</button>${qi<24?`<button class="next" onclick="next()">Next →</button>`:`<button class="submit" onclick="submit(false)">✅ Submit</button>`}</div>`;clock()}
function clock(){let e=document.getElementById("clock");if(e)e.textContent=String(Math.floor(Math.max(0,left)/60)).padStart(2,"0")+":"+String(Math.max(0,left)%60).padStart(2,"0")}
function pick(x){ans[qi]=x;showQ()}function next(){if(qi<24){qi++;showQ()}}function prev(){if(qi){qi--;showQ()}}
function submit(auto){if(!auto){let u=ans.filter(x=>x===null).length;if(!confirm(u?`You have ${u} unanswered question(s). Submit anyway?`:"Submit quiz?"))return}if(timer){clearInterval(timer);timer=null}let correct=qs.reduce((t,q,i)=>t+(ans[i]===q.a),0),score=correct*4;result(correct,score)}
function result(correct,score){let e=document.getElementById("quiz"),wrong=25-correct;e.innerHTML=`<div class="result"><div style="font-size:55px">${score>=60?"🏆":"📚"}</div><div class="eyebrow">CONCEPTQIZZER RESULT</div><h2>${score>=90?"Outstanding":score>=75?"Excellent":score>=60?"Great Work":"Keep Practising"}</h2><p>Class ${cls} • ${esc(subject)} • ${esc(chapter)} • ${levels[lev].n}</p><div class="score">${score}<small style="font-size:20px;color:#64748b">/100</small></div><div class="stats"><div><strong>${correct}</strong><br><small>Correct</small></div><div><strong>${wrong}</strong><br><small>Incorrect / Unanswered</small></div><div><strong>${score}%</strong><br><small>Percentage</small></div></div>${score>=60?`<div class="unlock">🎓 Certificate Unlocked!</div><button class="btn" onclick="certificate(${score})">🏆 Generate Certificate</button>`:`<div class="box" style="background:#fff1f2;color:#be123c">🔒 Score at least 60/100 to unlock the certificate.</div>`}</div>`;e.scrollIntoView({behavior:"smooth"})}
function certificate(score){let n=prompt("Enter your full name for the certificate:");if(!n||!n.trim())return;let d=new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"}),id="CQ-"+Date.now().toString(36).toUpperCase();document.getElementById("quiz").innerHTML=`<div class="cert"><div style="font-size:45px">🧠</div><div class="eyebrow">CONCEPTQIZZER</div><h1>Certificate of Achievement</h1><p>This certificate is proudly presented to</p><h2 class="student">${esc(n.trim())}</h2><p>for successfully completing the</p><h2 style="margin:12px">${esc(chapter)}</h2><p>ConceptQizzer Challenge • Class ${cls} • ${esc(subject)}</p><div class="certgrid"><div><strong>${levels[lev].n}</strong><br><small>Difficulty</small></div><div><strong>${score}/100</strong><br><small>Score</small></div><div><strong>${score}%</strong><br><small>Percentage</small></div></div><p><strong>${d}</strong><br><small>${id}</small></p><div style="font-size:42px;margin-top:20px">🏆</div></div><button class="btn" onclick="window.print()">🖨️ Print / Save Certificate</button>`}
render();
</script>
