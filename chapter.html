<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConceptQizzer | Chapter Learning</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #172033;
        }
      .site-header {
    background: #4f46e5;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.site-header strong {
    font-size: 22px;
}

.site-header span {
    font-size: 14px;
    opacity: 0.85;
}

.site-header a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    background: rgba(255,255,255,0.15);
    padding: 10px 14px;
    border-radius: 8px;
}

@media (max-width: 600px) {
    .site-header {
        flex-direction: column;
        align-items: flex-start;
    }
}
        /* ===== Chapter Page Premium Design ===== */

.chapter-container {
    width: 92%;
    max-width: 900px;
    margin: 28px auto 60px;
}

.breadcrumb {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 18px;
    line-height: 1.5;
}

.chapter-hero {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 28px 22px;
    border-radius: 22px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(79, 70, 229, 0.20);
}

.chapter-hero h1 {
    font-size: 34px;
    margin: 8px 0;
    line-height: 1.1;
}

.chapter-hero p {
    font-size: 17px;
    opacity: 0.9;
}

.class-badge {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.30);
    padding: 7px 13px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
}

.learning-card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin: 18px 0;
    box-shadow: 0 5px 20px rgba(15, 23, 42, 0.08);
    border: 1px solid #e8eaf2;
}

.learning-card h2 {
    font-size: 23px;
    color: #172033;
    margin-bottom: 10px;
}

.learning-card p {
    color: #64748b;
    font-size: 16px;
    line-height: 1.65;
}

.learning-card button {
    margin-top: 16px;
    border: none;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(79, 70, 229, 0.22);
}

.learning-card button:active {
    transform: scale(0.97);
}

#chapterContent {
    margin-top: 18px;
}

/* Mobile */
@media (max-width: 600px) {
    .chapter-container {
        width: auto;
        margin: 20px 16px 45px;
    }

    .chapter-hero {
        padding: 23px 18px;
        border-radius: 18px;
    }

    .chapter-hero h1 {
        font-size: 30px;
    }

    .learning-card {
        padding: 19px 17px;
        border-radius: 16px;
        margin: 15px 0;
    }

    .learning-card h2 {
        font-size: 21px;
    }

    .learning-card button {
        width: 100%;
        padding: 13px;
    }
}
    </style>
</head>

<body>
  <header class="site-header">
    <div>
        <strong>ConceptQizzer</strong>
        <span> • Learn • Practice • Master</span>
    </div>

    <a href="index.html">← Back to Home</a>
  </header>

    <main class="chapter-container">

    <div class="breadcrumb" id="breadcrumb">
        Class • Subject • Chapter
    </div>

    <section class="chapter-hero">
        <div class="class-badge" id="classBadge">Class</div>

        <h1 id="chapterTitle">Chapter Name</h1>

        <p id="subjectName">
            Subject
        </p>
    </section>

    <section class="learning-card">
        <h2>📖 About This Chapter</h2>

        <p>
            Welcome to your chapter learning space. Here you will
            understand important concepts, revise key points and
            test your knowledge.
        </p>
    </section>
<div id="chapterContent"></div>
    </main>
  <script>
const params = new URLSearchParams(window.location.search);

const classNumber = params.get("class");
const subject = params.get("subject");
const chapter = params.get("chapter");

document.getElementById("classBadge").textContent =
    classNumber ? "Class " + classNumber : "Class";

document.getElementById("subjectName").textContent =
    subject || "Subject";

document.getElementById("chapterTitle").textContent =
    chapter || "Chapter Name";

document.getElementById("breadcrumb").textContent =
    "Class " + (classNumber || "") +
    " • " + (subject || "Subject") +
    " • " + (chapter || "Chapter");
  </script>
    <script>
const contentBox = document.getElementById("chapterContent");

contentBox.innerHTML = `
    <section class="learning-card">
        <h2>📚 Chapter Notes</h2>
        <p>
            Notes for <strong>${chapter || "this chapter"}</strong>
            will appear here.
        </p>
    </section>

    <section class="learning-card">
        <h2>🧠 Take a Quiz</h2>
        <p>
            Test your understanding of
            <strong>${chapter || "this chapter"}</strong>.
        </p>
        <button>Start Quiz</button>
    </section>

    <section class="learning-card">
        <h2>✍️ Practice Exercises</h2>
        <p>
            Practice important questions from
            <strong>${chapter || "this chapter"}</strong>.
        </p>
        <button>Start Practice</button>
    </section>
`;
    </script>

</body>
</html>
