        const quizSettings = {
    "easy": {
        name: "Easy",
        time: 20,
        icon: "🌱"
    },
    "medium": {
        name: "Medium",
        time: 25,
        icon: "⚡"
    },
    "hard": {
        name: "Hard",
        time: 30,
        icon: "🔥"
    },
    "too-hard": {
        name: "Too Hard",
        time: 35,
        icon: "💀"
    },
    "extreme-hard": {
        name: "Extreme Hard",
        time: 40,
        icon: "👑"
    }
};

function selectDifficulty(level) {

    const settings = quizSettings[level];

    if (!settings) {
        alert("Quiz difficulty could not be loaded.");
        return;
    }

    const attemptKey =
        `conceptqizzer_${classNumber}_${subject}_${chapter}_${level}`;

    if (localStorage.getItem(attemptKey) === "completed") {
        alert(
            `You have already completed the ${settings.name} quiz for this chapter.`
        );
        return;
    }

    const confirmStart = confirm(
        `${settings.icon} ${settings.name} Quiz\n\n` +
        `Chapter: ${chapter}\n` +
        `Questions: 25\n` +
        `Marks: 100\n` +
        `Time: ${settings.time} minutes\n\n` +
        `Once submitted, this difficulty cannot be attempted again on this browser.\n\n` +
        `Start quiz?`
    );

    if (!confirmStart) {
        return;
    }

    startQuiz(level);
        }

    /* ===== ConceptQizzer Certificate ===== */

.certificate-wrapper {
    margin-top: 20px;
    text-align: center;

.certificate {
    position: relative;
    overflow: hidden;
    padding: 38px 22px;
    border-radius: 20px;
    background:
        radial-gradient(circle at top right, #f5f3ff 0, transparent 35%),
        radial-gradient(circle at bottom left, #fef3c7 0, transparent 35%),
        #ffffff;
    border: 5px double #6d5ce7;
    box-shadow: 0 12px 35px rgba(30, 41, 59, 0.12);
}

.certificate::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid #d8d2ff;
    border-radius: 13px;
    pointer-events: none;
}

.certificate-logo {
    width: 68px;
    height: 68px;
    margin: 0 auto 10px;

    justify-content: center;
    border-radius: 50%;

        let activeQuizQuestions = [];
let currentQuestionIndex = 0;
let selectedAnswers = [];
       
        let quizTimerInterval = null;
let quizTimeLeft = 0;

function shuffleArray(array) {
    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function prepareQuiz(level) {

    let questionPool = [];

    if (chapter === "Judiciary" && level === "easy") {
        questionPool = judiciaryQuizBank.easy;
    }

    if (questionPool.length < 25) {
        alert("This quiz is still being prepared.");
        return false;
    }

    activeQuizQuestions = shuffleArray(questionPool)
        .slice(0, 25)
        .map(item => ({
            ...item,
            options: shuffleArray(item.options)
        }));

    currentQuestionIndex = 0;
    selectedAnswers = new Array(25).fill(null);

    return true;
}
        function startQuizTimer() {
            updateTimerDisplay();

    if (quizTimerInterval) {
        clearInterval(quizTimerInterval);
    }

    quizTimerInterval = setInterval(() => {
        quizTimeLeft--;

        updateTimerDisplay();

        if (quizTimeLeft <= 0) {
            clearInterval(quizTimerInterval);
            quizTimerInterval = null;

            alert("⏰ Time is over! Your quiz will now be submitted.");
            submitQuiz(true);
        }
    }, 1000);
        }
        function updateTimerDisplay() {
    const minutes = Math.floor(quizTimeLeft / 60);
    const seconds = quizTimeLeft % 60;

    document.getElementById("timerDisplay").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
        }

function displayQuestion() {

    const question = activeQuizQuestions[currentQuestionIndex];

    if (!question) {
        return;
    }

    document.getElementById("questionCounter").textContent =
        `Question ${currentQuestionIndex + 1} of 25`;

    document.getElementById("questionText").textContent =
        question.question;

    document.getElementById("quizProgressBar").style.width =
        `${((currentQuestionIndex + 1) / 25) * 100}%`;

    const answerOptions = document.getElementById("answerOptions");

    answerOptions.innerHTML = "";

    question.options.forEach((option, index) => {

        const optionButton = document.createElement("button");

        optionButton.className = "quiz-answer-option";

        if (selectedAnswers[currentQuestionIndex] === option) {
            optionButton.classList.add("selected");
        }

        optionButton.innerHTML =
            `<span>${String.fromCharCode(65 + index)}</span>
             <p>${option}</p>`;

        optionButton.onclick = () => {
            selectAnswer(option);
        };

        answerOptions.appendChild(optionButton);
    });

    document.getElementById("previousQuestionBtn").disabled =
        currentQuestionIndex === 0;

    document.getElementById("nextQuestionBtn").style.display =
        currentQuestionIndex === 24 ? "none" : "block";

    document.getElementById("submitQuizBtn").style.display =
        currentQuestionIndex === 24 ? "block" : "none";
}

function selectAnswer(answer) {
    selectedAnswers[currentQuestionIndex] = answer;
    displayQuestion();
}

function nextQuestion() {
    if (currentQuestionIndex < 24) {
        currentQuestionIndex++;
        displayQuestion();
    }
}

function previousQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        displayQuestion();
    }
}
        function submitQuiz(autoSubmit = false) {

    if (!autoSubmit) {
        const unanswered =
            selectedAnswers.filter(answer => answer === null).length;

        const message = unanswered > 0
            ? `You still have ${unanswered} unanswered question(s).\n\nSubmit anyway?`
            : "Are you sure you want to submit your quiz?";

        if (!confirm(message)) {
            return;
        }
    }

    if (quizTimerInterval) {
        clearInterval(quizTimerInterval);
        quizTimerInterval = null;
    }

    let correctAnswers = 0;

    activeQuizQuestions.forEach((question, index) => {
        if (selectedAnswers[index] === question.answer) {
            correctAnswers++;
        }
    });

    const wrongAnswers = 25 - correctAnswers;
    const score = correctAnswers * 4;
    const percentage = score;

    const attemptKey =
        `conceptqizzer_${classNumber}_${subject}_${chapter}_${currentQuizLevel}`;

    localStorage.setItem(attemptKey, "completed");

    showQuizResult(
        correctAnswers,
        wrongAnswers,
        score,
        percentage
    );
}

function showQuizResult(correct, wrong, score, percentage) {

    const quizScreen = document.getElementById("quizScreen");

    let performance = "Keep Practising 📚";

    if (percentage >= 90) {
        performance = "Outstanding 🏆";
    } else if (percentage >= 75) {
        performance = "Excellent 🌟";
    } else if (percentage >= 60) {
        performance = "Great Work 🎯";
    } else if (percentage >= 40) {
        performance = "Good Attempt 👍";
    }

    quizScreen.innerHTML = `
        <div class="quiz-result">

            <div class="result-trophy">
                ${percentage >= 60 ? "🏆" : "📚"}
            </div>

            <small>CONCEPTQIZZER RESULT</small>

            <h2>${performance}</h2>

            <p>
                ${chapter} •
                ${quizSettings[currentQuizLevel].name}
            </p>

            <div class="result-score">
                <strong>${score}</strong>
                <span>/ 100</span>
            </div>

            <div class="result-stats">

                <div>
                    <strong>${correct}</strong>
                    <span>✅ Correct</span>
                </div>

                <div>
                    <strong>${wrong}</strong>
                    <span>❌ Incorrect / Unanswered</span>
                </div>

                <div>
                    <strong>${percentage}%</strong>
                    <span>📊 Percentage</span>
                </div>

            </div>

            ${
                percentage >= 60
                ? `
                <div class="certificate-unlocked">
                    🎓 Certificate Unlocked!
                    <p>
                        You passed this ConceptQizzer challenge.
                    </p>
                </div>

                <button onclick="generateCertificate()">
                    🏆 View Certificate
                </button>
                `
                : `
                <div class="certificate-locked">
                    🔒 Certificate requires at least 60/100.
                </div>
                `
            }

        </div>
    `;

    quizScreen.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}
        function generateCertificate() {

    const studentName = prompt(
        "🎓 Enter your full name for the certificate:"
    );

    if (!studentName || !studentName.trim()) {
        alert("Please enter your name to generate the certificate.");
        return;
    }

    const cleanName = studentName.trim();

    const score =
        activeQuizQuestions.reduce((total, question, index) => {
            return total +
                (selectedAnswers[index] === question.answer ? 4 : 0);
        }, 0);

    if (score < 60) {
        alert("You need at least 60/100 to earn a certificate.");
        return;
    }

    const today = new Date();

    const certificateDate = today.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

    const certificateId =
        "CQ-" +
        Date.now().toString(36).toUpperCase() +
        "-" +
        Math.random().toString(36)
            .substring(2, 6)
            .toUpperCase();

    const quizScreen =
        document.getElementById("quizScreen");

    quizScreen.innerHTML = `
        <div class="certificate-wrapper">

            <div class="certificate">

                <div class="certificate-logo">
                    🧠
                </div>

                <small>CONCEPTQIZZER</small>

                <h1>Certificate of Achievement</h1>

                <p class="certificate-intro">
                    This certificate is proudly presented to
                </p>

                <h2 class="student-name">
                    ${cleanName}
                </h2>

                <p>
                    for successfully completing the
                </p>

                <h3>
                    ${chapter}
                </h3>

                <p>
                    ConceptQizzer Challenge
                </p>

                <div class="certificate-details">

                    <div>
                        <strong>${quizSettings[currentQuizLevel].name}</strong>
                        <span>Difficulty</span>
                    </div>

                    <div>
                        <strong>${score}/100</strong>
                        <span>Score</span>
                    </div>

                    <div>
                        <strong>${score}%</strong>
                        <span>Percentage</span>
                    </div>

                </div>

                <div class="certificate-footer">

                    <div>
                        <strong>${certificateDate}</strong>
                        <span>Date</span>
                    </div>

                    <div>
                        <strong>${certificateId}</strong>
                        <span>Certificate ID</span>
                    </div>

                </div>

                <div class="certificate-badge">
                    🏆
                    <strong>ACHIEVEMENT</strong>
                </div>

            </div>

            <button class="print-certificate-btn"
                    onclick="window.print()">
                🖨️ Print / Save Certificate
            </button>

        </div>
    `;

    localStorage.setItem(
        `certificate_${certificateId}`,
        JSON.stringify({
            name: cleanName,
            chapter: chapter,
            difficulty: quizSettings[currentQuizLevel].name,
            score: score,
            date: certificateDate,
            id: certificateId
        })
    );

    quizScreen.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
        }
    </script>
