<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConceptQizzer | Chapter Learning</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            color: #172033;
        }
      .site-header {
    background: #4f46e5;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.site-header strong {
    font-size: 22px;
}

.site-header span {
    font-size: 14px;
    opacity: 0.85;
}

.site-header a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    background: rgba(255,255,255,0.15);
    padding: 10px 14px;
    border-radius: 8px;
}

@media (max-width: 600px) {
    .site-header {
        flex-direction: column;
        align-items: flex-start;
    }
}
        /* ===== Chapter Page Premium Design ===== */

.chapter-container {
    width: 92%;
    max-width: 900px;
    margin: 28px auto 60px;
}

.breadcrumb {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 18px;
    line-height: 1.5;
}

.chapter-hero {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 28px 22px;
    border-radius: 22px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(79, 70, 229, 0.20);
}

.chapter-hero h1 {
    font-size: 34px;
    margin: 8px 0;
    line-height: 1.1;
}

.chapter-hero p {
    font-size: 17px;
    opacity: 0.9;
}

.class-badge {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.30);
    padding: 7px 13px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
}

.learning-card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin: 18px 0;
    box-shadow: 0 5px 20px rgba(15, 23, 42, 0.08);
    border: 1px solid #e8eaf2;
}

.learning-card h2 {
    font-size: 23px;
    color: #172033;
    margin-bottom: 10px;
}

.learning-card p {
    color: #64748b;
    font-size: 16px;
    line-height: 1.65;
}

.learning-card button {
    margin-top: 16px;
    border: none;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(79, 70, 229, 0.22);
}

.learning-card button:active {
    transform: scale(0.97);
}

#chapterContent {
    margin-top: 18px;
}

/* Mobile */
@media (max-width: 600px) {
    .chapter-container {
        width: auto;
        margin: 20px 16px 45px;
    }

    .chapter-hero {
        padding: 23px 18px;
        border-radius: 18px;
    }

    .chapter-hero h1 {
        font-size: 30px;
    }

    .learning-card {
        padding: 19px 17px;
        border-radius: 16px;
        margin: 15px 0;
    }

    .learning-card h2 {
        font-size: 21px;
    }

    .learning-card button {
        width: 100%;
        padding: 13px;
    }
}
        /* ===== Creative Chapter Notes ===== */

.notes-card {
    background: linear-gradient(145deg, #ffffff, #f8f7ff);
    border: 1px solid #ebe8ff;
    overflow: hidden;
}

.notes-title {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 22px;
}

.notes-icon {
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    background: linear-gradient(135deg, #ede9fe, #ddd6fe);
    border-radius: 17px;
}

.notes-title small {
    color: #7c3aed;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
}

.notes-title h2 {
    margin: 3px 0 0;
    font-size: 25px;
    color: #172033;
}

.notes-overview {
    padding: 18px;
    background: linear-gradient(135deg, #f5f3ff, #eef2ff);
    border-radius: 16px;
    margin-bottom: 20px;
}

.notes-overview h3,
.key-concepts h3 {
    margin: 0 0 10px;
    color: #312e81;
    font-size: 18px;
}

.notes-overview p {
    margin: 0;
    line-height: 1.7;
    color: #596579;
}

.key-concepts {
    margin-top: 20px;
}

.concept-list {
    display: grid;
    gap: 10px;
}

.concept-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #ffffff;
    border: 1px solid #eceaf5;
    border-radius: 13px;
}

.concept-item span {
    min-width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #4f46e5, #9333ea);
    color: white;
    font-weight: 800;
}

.concept-item p {
    margin: 0;
    color: #374151;
    font-weight: 600;
    line-height: 1.4;
}

.fact-box {
    display: flex;
    gap: 13px;
    margin-top: 22px;
    padding: 17px;
    background: linear-gradient(135deg, #fff7d6, #fffbea);
    border: 1px solid #fde68a;
    border-radius: 16px;
}

.bulb {
    font-size: 27px;
}

.fact-box strong {
    color: #92400e;
    font-size: 16px;
}

.fact-box p {
    margin: 5px 0 0;
    color: #6b5a35;
    line-height: 1.5;
}
    </style>
</head>

<body>
  <header class="site-header">
    <div>
        <strong>ConceptQizzer</strong>
        <span> • Learn • Practice • Master</span>
    </div>

    <a href="index.html">← Back to Home</a>
  </header>

    <main class="chapter-container">

    <div class="breadcrumb" id="breadcrumb">
        Class • Subject • Chapter
    </div>

    <section class="chapter-hero">
        <div class="class-badge" id="classBadge">Class</div>

        <h1 id="chapterTitle">Chapter Name</h1>

        <p id="subjectName">
            Subject
        </p>
    </section>

    <section class="learning-card">
        <h2>📖 About This Chapter</h2>

        <p>
            Welcome to your chapter learning space. Here you will
            understand important concepts, revise key points and
            test your knowledge.
        </p>
    </section>
<div id="chapterContent"></div>
    </main>
  <script>
const params = new URLSearchParams(window.location.search);

const classNumber = params.get("class");
const subject = params.get("subject");
const chapter = params.get("chapter");

document.getElementById("classBadge").textContent =
    classNumber ? "Class " + classNumber : "Class";

document.getElementById("subjectName").textContent =
    subject || "Subject";

document.getElementById("chapterTitle").textContent =
    chapter || "Chapter Name";

document.getElementById("breadcrumb").textContent =
    "Class " + (classNumber || "") +
    " • " + (subject || "Subject") +
    " • " + (chapter || "Chapter");
  </script>
    <script>
const contentBox = document.getElementById("chapterContent");
        const chapterNotes = {
  "Judiciary": {
    icon: "⚖️",
    intro: "The Judiciary is an important organ of the Indian government. It protects the Constitution, safeguards Fundamental Rights and ensures that laws are applied fairly.",
    concepts: [
      "Independent Judiciary",
      "Supreme Court, High Courts & District Courts",
      "Civil and Criminal Law",
      "Public Interest Litigation (PIL)",
      "Protection of Fundamental Rights"
    ],
    fact: "The Supreme Court of India is the highest court in the country."
  },

  "Polynomials": {
    icon: "📐",
    intro: "A polynomial is an algebraic expression made up of variables, constants and whole-number powers of variables.",
    concepts: [
      "Terms and coefficients",
      "Degree of a polynomial",
      "Types of polynomials",
      "Zeroes of a polynomial",
      "Remainder and Factor Theorem"
    ],
    fact: "A polynomial with degree 2 is called a quadratic polynomial."
  }
};

const currentNotes = chapterNotes[chapter];

contentBox.innerHTML = `
<section class="learning-card notes-card">
    <div class="notes-title">
        <span class="notes-icon">${currentNotes?.icon || "📚"}</span>
        <div>
            <small>CHAPTER NOTES</small>
            <h2>${chapter || "Chapter"}</h2>
        </div>
    </div>

    <div class="notes-overview">
        <h3>✨ Quick Overview</h3>
        <p>
            ${currentNotes?.intro ||
            "Detailed notes for this chapter are coming soon."}
        </p>
    </div>

    ${
        currentNotes
        ? `
        <div class="key-concepts">
            <h3>🎯 Key Concepts</h3>

            <div class="concept-list">
                ${currentNotes.concepts.map((item, index) => `
                    <div class="concept-item">
                        <span>${index + 1}</span>
                        <p>${item}</p>
                    </div>
                `).join("")}
            </div>
        </div>

        <div class="fact-box">
            <span class="bulb">💡</span>
            <div>
                <strong>Did You Know?</strong>
                <p>${currentNotes.fact}</p>
            </div>
        </div>
        `
        : ""
    }
</section>

    <section class="learning-card">
        <h2>🧠 Take a Quiz</h2>
        <p>
            Test your understanding of
            <strong>${chapter || "this chapter"}</strong>.
        </p>
        <button>Start Quiz</button>
    </section>

    <section class="learning-card">
        <h2>✍️ Practice Exercises</h2>
        <p>
            Practice important questions from
            <strong>${chapter || "this chapter"}</strong>.
        </p>
        <button>Start Practice</button>
    </section>
`;
    </script>

</body>
</html>
