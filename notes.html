<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Concept Quizzer • Notes

</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
rel="stylesheet">

<link
rel="stylesheet"
href="css/notes.css">

</head>

<body>

<header
class="topBar">

<button
id="backButton"
class="iconButton">

<span
class="material-icons-round">

arrow_back

</span>

</button>

<div
class="titleArea">

<h2
id="chapterTitle">

Chapter Title

</h2>

<p
id="chapterPath">

Class • Subject

</p>

</div>

<button
id="bookmarkButton"
class="iconButton">

<span
class="material-icons-round">

bookmark_border

</span>

</button>

</header>

<main
class="notesContainer">

<section
class="heroCard">

<span
class="chapterBadge">

📘 Chapter Notes

</span>

<h1
id="notesHeading">

Loading...

</h1>

<p
id="notesDescription">

Easy-to-understand notes with important concepts and key points.

</p>

</section>

<section
id="notesContent"
class="notesContent">

<!-- Notes will be loaded here by notes.js -->

</section>

  <section
class="importantBox">

<h2>

Important Points

</h2>

<ul
id="importantPoints">

<!-- Generated by notes.js -->

</ul>

</section>

<section
class="keyTerms">

<h2>

Key Terms

</h2>

<div
id="keyTermsContainer">

<!-- Generated by notes.js -->

</div>

</section>

<section
class="summaryCard">

<h2>

Chapter Summary

</h2>

<p
id="chapterSummary">

Summary will appear here.

</p>

</section>

<div
class="navigationButtons">

<button
id="previousChapter"
class="navButton">

<span
class="material-icons-round">

arrow_back

</span>

Previous

</button>

<button
id="nextChapter"
class="navButton">

Next

<span
class="material-icons-round">

arrow_forward

</span>

</button>

</div>

</main>

<script src="js/notes/class6/mathematics/patterns-in-mathematics.js"></script>

<script src="js/notes.js"></script>

</body>

</html>
