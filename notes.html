<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept Quizzer • Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
  <link rel="stylesheet" href="css/notes.css">
</head>
<body>
  <header class="topBar">
    <button id="backButton" class="iconButton" aria-label="Back">
      <span class="material-icons-round">arrow_back</span>
    </button>

    <div class="titleArea">
      <h2 id="chapterTitle">Chapter Title</h2>
      <p id="chapterPath">Class • Subject</p>
    </div>

    <button id="bookmarkButton" class="iconButton" aria-label="Bookmark">
      <span class="material-icons-round">bookmark_border</span>
    </button>
    <button id="themeToggle" class="themeBtn" aria-label="Toggle theme">🌙</button>
  </header>

  <main class="notesContainer">
    <section class="heroCard">
      <span class="chapterBadge">📘 Chapter Notes</span>
      <h1 id="notesHeading">Loading...</h1>
      <p id="notesDescription">Easy-to-understand notes with important concepts and key points.</p>

      <div class="progressCard">
        <div class="progressInfo">
          <span>Chapter Progress</span>
          <span id="progressText">0%</span>
        </div>
        <div class="progressBar">
          <div id="progressFill"></div>
        </div>
      </div>
    </section>

    <div class="searchBox">
      <input id="chapterSearch" type="text" placeholder="🔍 Search in this chapter..." autocomplete="off">
    </div>

    <section id="notesContent" class="notesContent"></section>

    <section class="importantBox">
      <h2>Important Points</h2>
      <ul id="importantPoints"></ul>
    </section>

    <section class="keyTerms">
      <h2>Key Terms</h2>
      <div id="keyTermsContainer"></div>
    </section>

    <section class="summaryCard">
      <h2>Chapter Summary</h2>
      <p id="chapterSummary">Summary will appear here.</p>
    </section>

    <div class="navigationButtons">
      <button id="previousChapter" class="navButton">
        <span class="material-icons-round">arrow_back</span>
        <span>Previous</span>
      </button>
      <div id="chapterCounter" class="chapterCounter"></div>
      <button id="nextChapter" class="navButton">
        <span>Next</span>
        <span class="material-icons-round">arrow_forward</span>
      </button>
    </div>
  </main>

  <!-- IMPORTANT: This page uses notes.js as the single notes engine. -->
  <script src="js/chapter-registry.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
