<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Concept Quizzer - Quiz</title>

<link rel="stylesheet" href="css/quiz.css">
</head>

<body>

<div class="quizContainer">

<h1 id="quizTitle">
Quiz Loading...
</h1>

<p id="quizLevel">
Choose Difficulty
</p>

<div class="levelGrid">

<button class="level easy">

  <div class="recommended">
⭐ START HERE
  </div>

<h2>🟢 Easy</h2>

<p>10 Questions</p>

<span>Beginner Level</span>

  <div class="levelInfo">
    ⭐ Reward: 100 XP
    <br>
    ⏱ 5 Minutes
  </div>

</button>

<button class="level medium">

  <div class="lockBadge">
🔒 Locked
  </div>

<h2>🔵 Medium</h2>

<p>10 Questions</p>

<span>2× Tougher than Easy</span>

  <div class="levelInfo">
    ⭐ Reward: 200 XP
    <br>
    ⏱ 8 Minutes
  </div>

</button>

<button class="level hard">

  <div class="lockBadge">
🔒 Locked
  </div>

<h2>🟠 Hard</h2>

<p>15 Questions</p>

<span>Concept + Logic</span>

  <div class="levelInfo">
    ⭐ Reward: 350 XP
    <br>
    ⏱ 12 Minutes
  </div>

</button>

<button class="level tooHard">

<h2>🔴 Too Hard</h2>

  <div class="lockBadge">
🔒 Locked
  </div>

<p>20 Questions</p>

<span>Olympiad Level</span>

  <div class="levelInfo">
    ⭐ Reward: 500 XP
    <br>
    ⏱ 18 Minutes
  </div>

</button>

<button class="level extreme">

  <div class="lockBadge">
🔒 Locked
  </div>

<h2>⚫ Extreme</h2>

<p>25 Questions</p>

<span>Ultimate Challenge</span>

  <div class="levelInfo">
    ⭐ Reward: 1000 XP
    <br>
    ⏱ 25 Minutes
  </div>

</button>

</div>

</div>

<script src="js/quiz.js"></script>

</body>
</html>
