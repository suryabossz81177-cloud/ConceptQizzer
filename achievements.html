<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achievements – ConceptQuizzer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#4f46e5,#9333ea);
  min-height:100vh;
  color:white;
  padding:25px 15px;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:36px;
  margin:20px 0 8px;
}

.subtitle{
  text-align:center;
  opacity:.85;
  margin-bottom:25px;
}

.achievement{
  background:white;
  color:#222;
  border-radius:22px;
  padding:22px;
  margin:15px 0;
  display:flex;
  align-items:center;
  gap:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.icon{
  font-size:45px;
  width:65px;
  text-align:center;
}

.info{
  flex:1;
}

.info h2{
  font-size:21px;
  margin-bottom:6px;
}

.info p{
  color:#666;
  font-size:15px;
}

.status{
  font-size:28px;
}

.locked{
  opacity:.55;
}

.back{
  display:block;
  text-align:center;
  background:#22c55e;
  color:white;
  text-decoration:none;
  padding:17px;
  border-radius:16px;
  font-size:19px;
  font-weight:bold;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏆 Achievements</h1>
<p class="subtitle">Complete challenges and earn achievements!</p>

<div class="achievement" id="firstChapter">
  <div class="icon">🥇</div>
  <div class="info">
    <h2>First Chapter Completed</h2>
    <p>Complete your first chapter.</p>
  </div>
  <div class="status">🔒</div>
</div>

<div class="achievement" id="streak7">
  <div class="icon">🔥</div>
  <div class="info">
    <h2>7-Day Streak</h2>
    <p>Study for 7 consecutive days.</p>
  </div>
  <div class="status">🔒</div>
</div>

<div class="achievement" id="chapters50">
  <div class="icon">📚</div>
  <div class="info">
    <h2>50 Chapters Read</h2>
    <p>Complete 50 chapters.</p>
  </div>
  <div class="status">🔒</div>
</div>

<div class="achievement" id="quizMaster">
  <div class="icon">🎯</div>
  <div class="info">
    <h2>Quiz Master</h2>
    <p>Score 100% in a quiz.</p>
  </div>
  <div class="status">🔒</div>
</div>

<a href="index.html" class="back">🏠 Back to Home</a>

</div>

<script>
function getNumber(key){
  return Number(localStorage.getItem(key) || 0);
}

const chapters =
  getNumber("chaptersCompleted") ||
  getNumber("completedChapters");

const streak =
  getNumber("studyStreak") ||
  getNumber("streak");

const quizScore =
  getNumber("totalQuizScore");

const quizMaster =
  localStorage.getItem("quizMaster") === "true" ||
  localStorage.getItem("perfectQuiz") === "true";

function unlock(id){
  const card = document.getElementById(id);
  if(!card) return;

  card.classList.remove("locked");
  card.querySelector(".status").textContent = "✅";
}

if(chapters >= 1){
  unlock("firstChapter");
}

if(streak >= 7){
  unlock("streak7");
}

if(chapters >= 50){
  unlock("chapters50");
}

if(quizMaster || quizScore >= 10){
  unlock("quizMaster");
}
</script>

</body>
</html>
